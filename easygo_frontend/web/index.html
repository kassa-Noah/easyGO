<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="easygo_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Google Maps.

    The Maps JavaScript API has to be loaded here, before the app builds a map,
    because the browser is what loads the SDK. Uncomment the tag below and put
    your key in it, then pass the same value at build time:

      flutter run -d chrome --dart-define=GOOGLE_MAPS_API_KEY=your-key

    Without both, the app shows the branch coordinates and says the map is not
    configured rather than displaying an empty map.

    A web key is readable in dev tools by anyone who visits the site; that is how
    Google Maps works. Restrict it by HTTP referrer in the Google Cloud console
    instead of trying to hide it, and enable only the Maps JavaScript API.

    Leave this commented out until you have a key, so an unconfigured build does
    not make a failing request to Google on every page load.

    <script
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&loading=async"
      async
    ></script>
  -->

  <title>easygo_frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
